name: CI SharedService Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pack-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/SharedService

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack SharedService projects
        run: |
          mkdir -p ./dist
          dotnet pack ./SharedService.SharedKernel/SharedService.SharedKernel.csproj \
            --configuration Release \
            --output ./dist \
            -p:Version=0.0.1.${{ github.run_number }}

          dotnet pack ./SharedService.Framework/SharedService.Framework.csproj \
            --configuration Release \
            --output ./dist \
            -p:Version=0.0.2.${{ github.run_number }}

          dotnet pack ./SharedService.Core/SharedService.Core.csproj \
            --configuration Release \
            --output ./dist \
            -p:Version=0.0.3.${{ github.run_number }}

      - name: Push packages to GitHub Packages
        run: |
          dotnet nuget push "./dist/*.nupkg" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}" \
            --skip-duplicate
